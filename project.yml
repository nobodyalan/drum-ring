# =============================================================================
# XcodeGen 项目描述文件 — 在 macOS 上一键生成 .xcodeproj
# 用法: xcodegen generate
# =============================================================================
name: DrumHit

options:
  bundleIdPrefix: com.drumhit
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DrumHit:
    type: application
    platform: iOS

    sources:
      # 所有 Swift 源文件 (手写)
      - path: ios_develop/DrumHitApp
        includes:
          - "*.swift"
      # CI 自动生成: CoreML Swift 接口 (平时为空目录，CI 中由 coremlcompiler 生成)
      - path: ios_develop/Generated
        includes:
          - "*.swift"

    resources:
      # CoreML 模型: 本地开发用 .mlmodel (Xcode 自动编译) / CI 用 .mlmodelc
      - path: ios_develop/HitDetector.mlmodel
      # 音效文件
      - path: ios_develop/DrumHitApp/hit.wav
      # 预处理参数 JSON
      - path: ios_develop/DrumHitApp/preproc_params.json

    settings:
      base:
        INFOPLIST_FILE: ios_develop/DrumHitApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.drumhit.app
        # 手动签名 — CI 使用 ad-hoc 签名 (CODE_SIGN_IDENTITY="-")
        # AltStore 安装时会自动用你的 Apple ID 重新签名
        CODE_SIGN_STYLE: Manual
        # 编译为单一架构 (arm64)，加快 CI 速度
        ONLY_ACTIVE_ARCH: "YES"
        # Swift 版本
        SWIFT_VERSION: "5.0"
        # 支持 iOS 16+
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

    # 无需第三方依赖，全部使用 Apple 内置框架
    dependencies: []
