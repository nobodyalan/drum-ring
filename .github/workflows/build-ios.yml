# =============================================================================
# GitHub Actions — 免费 macOS 虚拟机自动编译 iOS IPA
# =============================================================================
# 不需要 Apple ID，不需要付费开发者账号！
# CI 编译出未签名的 IPA → 下载后用 AltStore 签名安装
# =============================================================================
name: "Build iOS App"

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. 安装 XcodeGen ──
      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

      # ── 3. 生成 .xcodeproj ──
      - name: Generate Xcode Project
        run: xcodegen generate

      # ── 4. 编译 + 打包 IPA (ad-hoc 签名，AltStore 安装时会重签) ──
      - name: Build and Package IPA
        run: |
          # 编译 (ad-hoc 签名，不需要开发者账号)
          xcodebuild build \
            -project DrumHit.xcodeproj \
            -scheme DrumHit \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            ONLY_ACTIVE_ARCH=NO | tee build.log

          # 找到编译好的 .app
          APP_PATH=$(find ./DerivedData -name "DrumHit.app" -type d | head -1)
          echo "App 路径: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件！"
            exit 1
          fi

          # 手动打包成 IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DrumHit.ipa Payload/
          rm -rf Payload
          ls -lh DrumHit.ipa
          echo "✅ IPA 生成成功"

      # ── 5. 上传 IPA ──
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumHit-${{ github.run_number }}
          path: ./DrumHit.ipa
          retention-days: 30
