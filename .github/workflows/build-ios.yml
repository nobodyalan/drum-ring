# =============================================================================
# GitHub Actions — 免费 macOS 虚拟机自动编译 iOS IPA
# =============================================================================
# 不需要 Apple ID，不需要付费开发者账号！
# CI 编译出未签名的 IPA → 下载后用 AltStore 签名安装
# =============================================================================
name: "Build iOS App"

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ── 1. 检出代码 ──
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. 编译 CoreML 模型 → Swift 源码 + .mlmodelc ──
      # Xcode 26 不再自动编译旧 .mlmodel (neuralnetwork) 格式
      # 用手动编译绕过：coremlc generate → Swift 类 + coremlc compile → .mlmodelc
      - name: Compile CoreML Model
        run: |
          set -e
          MODEL_PATH="ios_develop/HitDetector.mlmodel"
          GEN_DIR="ios_develop/Generated"
          rm -rf "$GEN_DIR"
          mkdir -p "$GEN_DIR"

          echo "模型文件: $(ls -lh "$MODEL_PATH")"
          echo "模型格式: $(file "$MODEL_PATH")"

          # ① 生成 Swift 接口类 (HitDetector)
          xcrun coremlc generate "$MODEL_PATH" "$GEN_DIR" \
            --language Swift \
            --swift-version 5 \
            --platform ios \
            --deployment-target 16.0
          echo ""
          echo "=== 生成的 Swift 文件 ==="
          ls -la "$GEN_DIR/"*.swift

          # ② 编译模型为 .mlmodelc (运行时资源)
          xcrun coremlc compile "$MODEL_PATH" "$GEN_DIR/"
          echo ""
          echo "=== 编译后的模型 ==="
          ls -laR "$GEN_DIR/HitDetector.mlmodelc"

          # ③ 从 project.yml 中删除 .mlmodel (CI 不依赖 Xcode 编译模型)
          sed -i '' '/- path: ios_develop\/HitDetector.mlmodel/d' project.yml
          echo ""
          echo "=== 更新后的 project.yml (resources) ==="
          sed -n '/resources:/,/settings:/p' project.yml

      # ── 3. 安装 XcodeGen ──
      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

      # ── 4. 生成 .xcodeproj ──
      - name: Generate Xcode Project
        run: xcodegen generate

      # ── 5. 编译 + 打包 IPA ──
      # 策略：xcodebuild 不签名编译 (避开 Xcode 26.5 禁 ad-hoc 的限制)
      #       编译完后用 codesign 手动加 ad-hoc 签名 (AltStore 能识别)
      #       AltStore 安装时会用自己的 Apple ID 重新签名
      - name: Build and Package IPA
        run: |
          set -e  # 任何命令失败立即退出

          # 第一步：编译但不签名
          xcodebuild build \
            -project DrumHit.xcodeproj \
            -scheme DrumHit \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | tee build.log

          # 找到编译好的 .app
          APP_PATH=$(find ./DerivedData -name "DrumHit.app" -type d | head -1)
          echo "App 路径: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件！"
            exit 1
          fi

          # 验证 .app 完整性
          echo ""
          echo "========== Info.plist =========="
          plutil -p "$APP_PATH/Info.plist"
          echo ""
          echo "========== .app 内容 =========="
          ls -la "$APP_PATH/"
          echo ""
          # 检查可执行文件 (命名为 target 名 DrumHit)
          if [ -f "$APP_PATH/DrumHit" ]; then
            echo "✅ 可执行文件存在: $(file "$APP_PATH/DrumHit")"
          else
            echo "❌ 可执行文件 DrumHit 缺失！"
            exit 1
          fi

          # 第二步：手动复制所有资源到 app bundle
          # xcodebuild 在 CODE_SIGNING_ALLOWED=NO 下跳过了资源复制阶段
          # 手动复制确保 hit.wav / preproc_params.json / .mlmodelc 都在 bundle 中
          echo ""
          echo "正在复制资源文件到 .app..."
          cp "1.wav" "$APP_PATH/"
          cp "ios_develop/DrumHitApp/preproc_params.json" "$APP_PATH/"
          cp -R "ios_develop/Generated/HitDetector.mlmodelc" "$APP_PATH/"
          echo "✅ 资源已添加:"
          ls -la "$APP_PATH/"

          # 第三步：手动 ad-hoc 签名
          echo "正在添加 ad-hoc 签名..."
          codesign --force --sign - --timestamp=none "$APP_PATH"
          echo "✅ ad-hoc 签名完成"

          # 第四步：打包成 IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DrumHit.ipa Payload/
          rm -rf Payload
          ls -lh DrumHit.ipa
          echo "✅ IPA 生成成功"

      # ── 6. 上传 IPA ──
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumHit-${{ github.run_number }}
          path: ./DrumHit.ipa
          retention-days: 30
